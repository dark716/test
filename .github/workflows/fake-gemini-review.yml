name: Machine Marker Commit Test

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  marker:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - name: Create Gemini review marker commit as dark716
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CHATGPT_TRIGGER_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            const headCommit = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: pr.head.sha
            });

            if (headCommit.data.commit.message.startsWith('GEMINI_REVIEW_MARKER')) {
              core.info('Marker commit detected; stopping to prevent a loop.');
              return;
            }

            const jobId = 'comic-pipeline-test-01';
            const path = `.signals/gemini-review-complete-pat-${context.runId}.txt`;
            const body = [
              'GEMINI_REVIEW_COMPLETE',
              `JOB_ID: ${jobId}`,
              `SOURCE_RUN_ID: ${context.runId}`
            ].join('\n');

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `GEMINI_REVIEW_MARKER JOB_ID: ${jobId}`,
              content: Buffer.from(body, 'utf8').toString('base64'),
              branch: pr.head.ref
            });
