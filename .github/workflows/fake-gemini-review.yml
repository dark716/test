name: Gemini Independent Review

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Process Gemini review request
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          github-token: ${{ secrets.CHATGPT_TRIGGER_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            const headCommit = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: pr.head.sha
            });

            const message = headCommit.data.commit.message.trim();
            if (!message.startsWith('GEMINI_REVIEW_REQUEST')) {
              core.info(`Ignoring non-request commit: ${message}`);
              return;
            }

            const match = message.match(/JOB_ID:\s*([A-Za-z0-9._-]+)/);
            if (!match) {
              core.setFailed('GEMINI_REVIEW_REQUEST commit is missing a valid JOB_ID.');
              return;
            }
            const jobId = match[1];

            if (!process.env.GEMINI_API_KEY) {
              core.setFailed('GEMINI_API_KEY repository secret is not configured.');
              return;
            }

            const requestPath = `jobs/${jobId}/review_request.json`;
            const requestFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: requestPath,
              ref: pr.head.ref
            });
            if (Array.isArray(requestFile.data) || !requestFile.data.content) {
              core.setFailed(`Review request file not found: ${requestPath}`);
              return;
            }

            const requestText = Buffer.from(requestFile.data.content, 'base64').toString('utf8');
            const reviewInput = JSON.parse(requestText);

            const reviewerPrompt = [
              'You are an independent educational-content reviewer.',
              'Review only the supplied source material, user requirements, neutral review policy, and candidate output.',
              'Do not infer or discuss the producer model reasoning, intentions, uncertainty, or hidden context.',
              'Flag factual errors, misleading simplifications, learning-goal failures, and age-inappropriate explanations.',
              'A major factual error must produce FAIL.',
              '',
              'REVIEW INPUT:',
              JSON.stringify(reviewInput, null, 2)
            ].join('\n');

            const responseSchema = {
              type: 'object',
              properties: {
                status: { type: 'string', enum: ['PASS', 'FAIL'] },
                summary: { type: 'string' },
                issues: {
                  type: 'array',
                  items: {
                    type: 'object',
                    properties: {
                      severity: { type: 'string', enum: ['critical', 'major', 'minor'] },
                      category: { type: 'string' },
                      location: { type: 'string' },
                      problem: { type: 'string' },
                      required_fix: { type: 'string' },
                      confidence: { type: 'string', enum: ['high', 'medium', 'low'] }
                    },
                    required: ['severity', 'category', 'location', 'problem', 'required_fix', 'confidence']
                  }
                },
                overall_confidence: { type: 'string', enum: ['high', 'medium', 'low'] }
              },
              required: ['status', 'summary', 'issues', 'overall_confidence']
            };

            const models = ['gemini-3.7-flash', 'gemini-3.6-flash', 'gemini-3.5-flash'];
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            let apiData = null;
            let usedModel = null;
            let lastError = null;

            for (const model of models) {
              for (let attempt = 1; attempt <= 3; attempt++) {
                core.info(`Gemini request: model=${model}, attempt=${attempt}`);
                const apiResponse = await fetch(
                  `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
                  {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'x-goog-api-key': process.env.GEMINI_API_KEY
                    },
                    body: JSON.stringify({
                      contents: [{ role: 'user', parts: [{ text: reviewerPrompt }] }],
                      generationConfig: {
                        temperature: 0.2,
                        responseMimeType: 'application/json',
                        responseJsonSchema: responseSchema
                      }
                    })
                  }
                );

                const apiText = await apiResponse.text();
                if (apiResponse.ok) {
                  apiData = JSON.parse(apiText);
                  usedModel = model;
                  break;
                }

                lastError = `Gemini API error ${apiResponse.status} on ${model}: ${apiText}`;
                const retryable = apiResponse.status === 503 || apiResponse.status === 429;
                if (!retryable) {
                  core.setFailed(lastError);
                  return;
                }

                if (attempt < 3) {
                  const delayMs = attempt === 1 ? 5000 : 15000;
                  core.warning(`${lastError}\nRetrying in ${delayMs / 1000}s.`);
                  await sleep(delayMs);
                }
              }

              if (apiData) break;
              core.warning(`Model ${model} remained unavailable; trying fallback model.`);
            }

            if (!apiData) {
              core.setFailed(lastError || 'All Gemini models failed without a usable response.');
              return;
            }

            const reviewText = (apiData.candidates?.[0]?.content?.parts || [])
              .map(part => part.text || '')
              .join('')
              .trim();
            if (!reviewText) {
              core.setFailed('Gemini returned no review text.');
              return;
            }

            const review = JSON.parse(reviewText);
            const resultPath = `.signals/reviews/${jobId}-${context.runId}.json`;
            const resultBody = JSON.stringify({
              signal: 'GEMINI_REVIEW_COMPLETE',
              job_id: jobId,
              source_request_commit: pr.head.sha,
              source_run_id: context.runId,
              reviewer_model: usedModel,
              review
            }, null, 2);

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: resultPath,
              message: `GEMINI_REVIEW_MARKER JOB_ID: ${jobId}`,
              content: Buffer.from(resultBody, 'utf8').toString('base64'),
              branch: pr.head.ref
            });
