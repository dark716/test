name: Gemini Independent Review

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Process Gemini review request
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const head = await github.rest.repos.getCommit({ owner, repo, ref: pr.head.sha });
            const message = head.data.commit.message.trim();

            if (!message.startsWith('GEMINI_REVIEW_REQUEST')) {
              core.info(`Ignoring non-request commit: ${message}`);
              return;
            }

            const match = message.match(/JOB_ID:\s*([A-Za-z0-9._-]+)/);
            if (!match) return core.setFailed('Missing valid JOB_ID.');
            const jobId = match[1];
            if (!process.env.GEMINI_API_KEY) return core.setFailed('GEMINI_API_KEY is not configured.');

            const requestPath = `jobs/${jobId}/review_request.json`;
            const file = await github.rest.repos.getContent({ owner, repo, path: requestPath, ref: pr.head.ref });
            if (Array.isArray(file.data) || !file.data.content) return core.setFailed(`Missing ${requestPath}`);
            const reviewInput = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'));

            const prompt = [
              'You are an independent educational-content reviewer.',
              'Use only the supplied source material, user requirements, neutral review policy, and candidate output.',
              'Do not infer or discuss producer reasoning, intentions, uncertainty, or hidden context.',
              'Flag factual errors, misleading simplifications, learning-goal failures, and age-inappropriate explanations.',
              'Any critical or major issue requires FAIL.',
              '',
              'REVIEW INPUT:',
              JSON.stringify(reviewInput, null, 2)
            ].join('\n');

            const schema = {
              type: 'object',
              properties: {
                status: { type: 'string', enum: ['PASS', 'FAIL'] },
                summary: { type: 'string' },
                issues: {
                  type: 'array',
                  items: {
                    type: 'object',
                    properties: {
                      severity: { type: 'string', enum: ['critical', 'major', 'minor'] },
                      category: { type: 'string' },
                      location: { type: 'string' },
                      problem: { type: 'string' },
                      required_fix: { type: 'string' },
                      confidence: { type: 'string', enum: ['high', 'medium', 'low'] }
                    },
                    required: ['severity', 'category', 'location', 'problem', 'required_fix', 'confidence']
                  }
                },
                overall_confidence: { type: 'string', enum: ['high', 'medium', 'low'] }
              },
              required: ['status', 'summary', 'issues', 'overall_confidence']
            };

            const models = ['gemini-3.7-flash', 'gemini-3.6-flash', 'gemini-3.5-flash'];
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            let data = null;
            let usedModel = null;
            let lastError = null;

            for (const model of models) {
              for (let attempt = 1; attempt <= 3; attempt++) {
                core.info(`model=${model} attempt=${attempt}`);
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'x-goog-api-key': process.env.GEMINI_API_KEY },
                  body: JSON.stringify({
                    contents: [{ role: 'user', parts: [{ text: prompt }] }],
                    generationConfig: {
                      temperature: 0.2,
                      responseMimeType: 'application/json',
                      responseJsonSchema: schema
                    }
                  })
                });
                const text = await res.text();
                if (res.ok) {
                  data = JSON.parse(text);
                  usedModel = model;
                  break;
                }
                lastError = `Gemini ${res.status} on ${model}: ${text}`;
                if (![429, 503].includes(res.status)) return core.setFailed(lastError);
                if (attempt < 3) await sleep(attempt === 1 ? 5000 : 15000);
              }
              if (data) break;
            }

            if (!data) return core.setFailed(lastError || 'All Gemini review attempts failed.');
            const reviewText = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
            if (!reviewText) return core.setFailed('Gemini returned no review JSON.');
            const review = JSON.parse(reviewText);

            const resultPath = `.signals/reviews/${jobId}-${context.runId}.json`;
            const result = {
              signal: 'GEMINI_REVIEW_COMPLETE',
              job_id: jobId,
              review_round: reviewInput.review_round,
              source_request_commit: pr.head.sha,
              source_run_id: context.runId,
              reviewer_model: usedModel,
              review
            };

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: resultPath,
              message: `GEMINI_REVIEW_MARKER JOB_ID: ${jobId}`,
              content: Buffer.from(JSON.stringify(result, null, 2), 'utf8').toString('base64'),
              branch: pr.head.ref
            });
