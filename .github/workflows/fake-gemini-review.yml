name: Fake Gemini Review Trigger

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  notify:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - name: Post fake review completion comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'GEMINI_REVIEW_COMPLETE\n\nFake review result is ready in jobs/comic-pipeline-test-01/review.json.'
            });
